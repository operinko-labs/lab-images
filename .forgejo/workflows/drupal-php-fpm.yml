name: Build & Push drupal-php-fpm

on:
  push:
    branches: [main]
    paths:
      - "drupal-php-fpm/8.5-fpm-alpine/**"
  schedule:
    # Weekly rebuild so the image picks up php:8.5-fpm-alpine patch and
    # security releases (Mondays 03:30 UTC, after the nginx-brotli rebuild).
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Harbor registry host
        run: |
          REGISTRY="$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/operinko-labs/drupal-php-fpm" >> "$GITHUB_ENV"

      - name: Build tag list
        id: tags
        run: |
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              tag="${tag//$'\r'/}"
              [[ -z "$tag" || "$tag" == "#"* ]] && continue
              echo "${{ env.IMAGE }}:${tag}"
            done < drupal-php-fpm/8.5-fpm-alpine/TAGS
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: drupal-php-fpm/8.5-fpm-alpine
          file: drupal-php-fpm/8.5-fpm-alpine/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
