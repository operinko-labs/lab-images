name: Build & Push drupal-php-fpm

on:
  push:
    branches: [main]
    paths:
      - "drupal-php-fpm/8.5-fpm-alpine/**"
  schedule:
    # Weekly rebuild so the image picks up php:8.5-fpm-alpine patch and
    # security releases (Mondays 03:30 UTC, after the nginx-brotli rebuild).
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Harbor registry host
        run: |
          REGISTRY="$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/operinko-labs/drupal-php-fpm" >> "$GITHUB_ENV"

      - name: Build tag list
        id: tags
        run: |
          tags=()
          while IFS= read -r tag; do
            tag="${tag//$'\r'/}"
            [[ -z "$tag" || "$tag" == "#"* ]] && continue
            tags+=("${{ env.IMAGE }}:${tag}")
          done < drupal-php-fpm/8.5-fpm-alpine/TAGS
          echo "first=${tags[0]}" >> "$GITHUB_OUTPUT"
          echo "extra=${tags[*]:1}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Push one tag only: Harbor answers 412 to manifest reads while
      # scan-on-push runs (prevent_vul), and buildx reads the manifest back
      # for every further tag, so the rest are added once the scan is done.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: drupal-php-fpm/8.5-fpm-alpine
          file: drupal-php-fpm/8.5-fpm-alpine/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.first }}
          platforms: linux/amd64

      - name: Add remaining tags
        if: steps.tags.outputs.extra != ''
        run: |
          for tag in ${{ steps.tags.outputs.extra }}; do
            for i in $(seq 1 30); do
              docker buildx imagetools create --tag "$tag" "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" && break
              [[ $i == 30 ]] && exit 1
              sleep 10
            done
          done
