name: Build & Push nginx-brotli

on:
  push:
    branches: [main]
    paths:
      - "nginx-brotli/alpine/**"
  schedule:
    # Weekly rebuild so the image picks up nginx:alpine security updates
    # (Mondays 03:00 UTC, ahead of gpro's Monday-morning Renovate window).
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Harbor registry host
        run: |
          REGISTRY="$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/operinko-labs/nginx-brotli" >> "$GITHUB_ENV"

      - name: Build tag list
        id: tags
        run: |
          tags=()
          while IFS= read -r tag; do
            tag="${tag//$'\r'/}"
            [[ -z "$tag" || "$tag" == "#"* ]] && continue
            tags+=("${{ env.IMAGE }}:${tag}")
          done < nginx-brotli/alpine/TAGS
          echo "first=${tags[0]}" >> "$GITHUB_OUTPUT"
          echo "extra=${tags[*]:1}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Push one tag only: Harbor answers 412 to manifest reads while
      # scan-on-push runs (prevent_vul), and buildx reads the manifest back
      # for every further tag, so the rest are added once the scan is done.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: nginx-brotli/alpine
          file: nginx-brotli/alpine/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.first }}
          platforms: linux/amd64

      # sigstore/cosign-installer needs envsubst, which the runner image lacks.
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Sign the pushed digest with the operinko-labs key (public half:
      # cosign.pub in homeops). Legacy .sig tag, no Rekor upload: Harbor shows
      # it as a signature.cosign accessory and nothing leaves the homelab.
      # Retry while scan-on-push answers 412 to the manifest read.
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
              "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" && exit 0
            sleep 10
          done
          exit 1

      - name: Add remaining tags
        if: steps.tags.outputs.extra != ''
        run: |
          for tag in ${{ steps.tags.outputs.extra }}; do
            for i in $(seq 1 30); do
              docker buildx imagetools create --tag "$tag" "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" && break
              [[ $i == 30 ]] && exit 1
              sleep 10
            done
          done
