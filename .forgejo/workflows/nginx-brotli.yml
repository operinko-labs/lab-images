name: Build & Push nginx-brotli

on:
  push:
    branches: [main]
    paths:
      - "nginx-brotli/alpine/**"
  schedule:
    # Weekly rebuild so the image picks up nginx:alpine security updates
    # (Mondays 03:00 UTC, ahead of gpro's Monday-morning Renovate window).
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Harbor registry host
        run: |
          REGISTRY="$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/operinko-labs/nginx-brotli" >> "$GITHUB_ENV"

      - name: Build tag list
        id: tags
        run: |
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              tag="${tag//$'\r'/}"
              [[ -z "$tag" || "$tag" == "#"* ]] && continue
              echo "${{ env.IMAGE }}:${tag}"
            done < nginx-brotli/alpine/TAGS
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: nginx-brotli/alpine
          file: nginx-brotli/alpine/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
